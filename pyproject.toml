[project]
name = "refindmgr"
version = "1.6.0"
description = "CLI ringan untuk memasang, mengganti, dan menghapus tema rEFInd tanpa edit manual refind.conf."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rizqi Ananda" }]
keywords = ["refind", "uefi", "bootloader", "theme", "efi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Boot",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/anandarizqi/refindmgr"
Issues = "https://github.com/anandarizqi/refindmgr/issues"

[project.scripts]
refindmgr = "refindmgr.cli:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["refindmgr*"]

[tool.setuptools.package-data]
# PNG is required at runtime: the Kitty graphics protocol's f=100 direct
# transfer accepts PNG only, and that backend is what makes previews work with
# no external renderer installed. The JPEGs stay for the other backends.
refindmgr = ["assets/previews/*.png", "assets/previews/*.jpg"]
